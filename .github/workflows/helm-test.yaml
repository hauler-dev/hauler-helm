name: Lint and Test Charts

on: push

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --all

      - name: Start k3s
        uses: debianmaster/actions-k3s@master
        id: k3s
        with:
          version: 'latest'

      - name: Wait for k3s
        run: |
          while ! kubectl get po -n kube-system -l app.kubernetes.io/name=traefik -ojsonpath='{.items[*].status.containerStatuses[*].ready}' | grep -q true
          do
          sleep 1
          done

      - name: Install Test Cases
        run: |
          for testvalue in $(ls charts/hauler/ci/*-values.yaml)
          do
            name=$(basename ${testvalue}| rev | cut -c13- | rev)
            echo $name - $testvalue
            helm install $name charts/hauler --namespace hauler-${name} --values ${testvalue} --create-namespace
          done

      - name: Wait for Installs/Loads
        run: |
          while kubectl get po -A --no-headers | grep -v 'Running\|Completed'
          do
            echo waiting for these to run or complete:
            kubectl get po -A --no-headers | grep -v 'Running\|Completed'
            sleep 2
          done

      - name: Get debug output
        run: |
          kubectl apply -f charts/hauler/ci/test-pod.yaml
          kubectl get po -A
          kubectl get svc -A
          REG_IP=$(kubectl get svc hauler-registry -ojsonpath='{.spec.clusterIP}')
          FILE_IP=$(kubectl get svc hauler-fileserver -ojsonpath='{.spec.clusterIP}')
          REG_POD=$(kubectl get po -l app=hauler-registry -ojsonpath='{.items[0].metadata.name}')
          FILE_POD=$(kubectl get po -l app=hauler-fileserver -ojsonpath='{.items[0].metadata.name}')
          while ! kubectl get po test-pod -ojsonpath='{.status.containerStatuses[0].ready}' | grep true
          do
            sleep 1
          done
          echo http://$REG_IP:5000/v2/_catalog
          kubectl exec -q test-pod -- curl -s http://$REG_IP:5000/v2/_catalog > /tmp/registry_output.txt
          echo registry output:
          cat /tmp/registry_output.txt
          echo http://$FILE_IP:8080/
          kubectl exec -q test-pod -- curl -s http://$FILE_IP:8080 > /tmp/fileserver_output.txt
          echo file output:
          cat /tmp/fileserver_output.txt
