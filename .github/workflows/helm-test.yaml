name: Lint and Test Charts

on: push

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --all

      - name: Start k3s
        uses: debianmaster/actions-k3s@master
        id: k3s
        with:
          version: 'latest'

      - name: Wait for k3s
        run: |
          while ! kubectl get po -n kube-system -l app.kubernetes.io/name=traefik -ojsonpath='{.items[*].status.containerStatuses[*].ready}' | grep -q true
          do
          sleep 1
          done

      - name: Install Test Cases
        run: |
          for testvalue in $(ls charts/hauler/ci/*-values.yaml)
          do
            name=$(basename ${testvalue}| rev | cut -c13- | rev)
            namespace=hauler-${name}
            echo $name - $testvalue
            helm install $name charts/hauler --namespace ${namespace} --values ${testvalue} --create-namespace
          done

      - name: Download & Prep "local" Test Files
        run: |
          mkdir -pv /tmp/tests/ /tmp/tests/store
          echo "Download local-haul.tar.zst"
          curl -o /tmp/tests/local-haul.tar.zst https://raw.githubusercontent.com/hauler-dev/hauler/main/testdata/haul.tar.zst
          echo "Download local-manifest.yaml"
          curl -o /tmp/tests/local-manifest.yaml https://raw.githubusercontent.com/tayterz2/hauler-helm/refs/heads/main/charts/hauler/ci/test-manifest.yaml
          echo "Download hauler binary"
          curl -sfL https://get.hauler.dev | HAULER_INSTALL_DIR=/tmp/hauler bash
          echo "Create local store"
          /tmp/hauler/hauler store -s /tmp/tests/store sync charts/hauler/ci/store-manifest.yaml

      - name: debug
        run: |
          while true
          do
            kubectl logs -n hauler-local-manifests -lbatch.kubernetes.io/job-name=hauler-loader -c hauler-load -f
            sleep 1
          done
        
      - name: Wait for Installs/Loads
        run: |
          while kubectl get po -A --no-headers | grep -v 'Running\|Completed'
          do
            echo waiting for these to run or complete:
            kubectl get po -A --no-headers | grep -v 'Running\|Completed'
            sleep 2
          done

      - name: Get debug output
        run: |
          kubectl apply -f charts/hauler/ci/test-pod.yaml
          while ! kubectl get po test-pod -ojsonpath='{.status.containerStatuses[0].ready}' | grep true
          do
            sleep 1
          done
          for testvalue in $(ls charts/hauler/ci/*-values.yaml)
          do
            name=$(basename ${testvalue}| rev | cut -c13- | rev)
            namespace=hauler-${name}
            REGISTRY_URL=http://hauler-registry.${namespace}.svc.cluster.local:5000/v2/_catalog
            echo REGISTRY_URL = $REGISTRY_URL
            kubectl exec -q test-pod -- curl -s ${REGISTRY_URL} > /tmp/registry_output.txt
            echo registry output:
            cat /tmp/registry_output.txt
            HTTP_URL=http://hauler-fileserver.${namespace}.svc.cluster.local:8080
            echo HTTP_URL = $HTTP_URL
            kubectl exec -q test-pod -- curl -s ${HTTP_URL} > /tmp/fileserver_output.txt
            echo file output:
            cat /tmp/fileserver_output.txt
          done
