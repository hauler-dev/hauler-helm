name: Lint and Test Charts

on: push

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

          #- name: Create kind cluster
          #if: steps.list-changed.outputs.changed == 'true'
          #uses: helm/kind-action@v1.10.0

      - name: Create k3d cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: "helm-cluster"

      - name: Create Namespace
        run: kubectl create namespace helm-test

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }} --skip-clean-up --namespace helm-test

      - name: Get debug output
        run: |
          kubectl get po -A
          kubectl get svc -A
          ls -lha /tmp/kubePV
          REG_IP=$(kubectl get svc -n helm-test hauler-registry -ojsonpath='{.spec.clusterIP}')
          FILE_IP=$(kubectl get svc -n helm-test hauler-fileserver -ojsonpath='{.spec.clusterIP}')
          REG_POD=$(kubectl get po -n helm-test -l app=hauler-registry -ojsonpath='{.items[0].metadata.name}')
          FILE_POD=$(kubectl get po -n helm-test -l app=hauler-fileserver -ojsonpath='{.items[0].metadata.name}')
          echo http://$REG_IP:5000/v2/_catalog
          kubectl debug -n helm-test $REG_POD --image=hauler/hauler-debug:1.1.1 -ti -- curl http://$REG_IP:5000/v2/_catalog
          echo http://$FILE_IP:8080/
          kubectl debug -n helm-test $FILE_POD --image=hauler/hauler-debug:1.1.1 -ti -- curl http://$FILE_IP:5000/v2/_catalog
