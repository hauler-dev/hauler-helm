name: Bug Report
description: submit a bug report to help us improve the hauler helm chart
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        thank you for helping us improve hauler... please fill out each section so we can better assist you. bugs in the `hauler` cli itself belong in [hauler-dev/hauler](https://github.com/hauler-dev/hauler/issues).

  - type: checkboxes
    id: checklist
    attributes:
      label: Before Submitting
      options:
        - label: I searched the existing issues and this bug has not been reported
          required: true

  - type: input
    id: chart-version
    attributes:
      label: Chart Version
      description: provide the chart version from `helm list -A`
      placeholder: 2.4.2
    validations:
      required: true

  - type: input
    id: hauler-version
    attributes:
      label: Hauler Version
      description: provide the hauler image tag in use (`hauler.image.tag` or the chart appVersion)
      placeholder: 2.1.2
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environmental Info
      description: provide the output of `kubectl version` and the distribution (i.e. rke2, k3s, eks) and storage class in use
      render: text
    validations:
      required: true

  - type: textarea
    id: values
    attributes:
      label: Helm Values
      description: provide the values used to install the chart (`helm get values <release> -n <namespace>`)... remove any credentials
      render: yaml
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: provide a clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: provide the exact helm commands needed to reproduce the bug
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: provide a clear and concise description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: provide a clear and concise description of what actually happens
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: provide relevant output from `kubectl logs` (i.e. hauler-loader job, hauler-registry, hauler-fileserver) and `kubectl describe` of failing pods
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: provide any other context about the bug (i.e. ingress controller, pvc access modes, node selectors)
    validations:
      required: false
