apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hauler.fullname" . }}-service-account
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hauler.labels" . | nindent 4 }}
  {{- include "hauler.annotations" (dict "root" .) | nindent 2 }}
automountServiceAccountToken: false
